[project]
name = "aibi-toolkit"
version = "0.6.0"
description = "Helpers for BI semantic-model metadata cleanup"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[project.scripts]
aibi = "aibi_toolkit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
